[package]
name        = "raspi-audio-recorder"
version     = "0.1.0"
edition     = "2021"
description = "Stream multi-mic audio from Raspberry Pi to AWS (Firehose / Kinesis / Lambda)"

[[bin]]
name = "raspi-audio-recorder"
path = "src/main.rs"

[dependencies]
alsa               = "0.9"
aws-config         = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-firehose   = "1"
aws-sdk-kinesis    = "1"
aws-sdk-lambda     = "1"
tokio              = { version = "1", features = ["full"] }
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
base64             = "0.22"
chrono             = { version = "0.4", features = ["serde"] }
clap               = { version = "4", features = ["derive"] }
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow             = "1"

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
strip         = true
